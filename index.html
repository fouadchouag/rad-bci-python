<!doctype html>
<meta charset="utf-8" />
<title>RAD BCI – Ball Control (HTTP)</title>
<style>
  :root { --w: 800px; --h: 500px; }
  body { font-family: system-ui, sans-serif; margin: 24px; }
  #field {
    position: relative; width: var(--w); height: var(--h);
    border: 2px solid #444; border-radius: 14px; background: #fafafa;
    overflow: hidden; user-select: none;
  }
  #ball {
    position: absolute; width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, #88a);
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 6px 14px rgba(0,0,0,.2);
  }
  #hud { margin: 12px 0 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #log { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  label { display: inline-flex; align-items: center; gap: 6px; }
  input[type="text"], input[type="number"] { padding: 6px 8px; }
  button { padding: 8px 12px; cursor: pointer; }
</style>

<div id="hud">
  <label>Server URL: <input id="url" type="text" value="http://127.0.0.1:8000"></label>
  <label>Poll (ms): <input id="poll" type="number" value="100" min="50" step="10"></label>
  <button id="connect">Start</button>
  <button id="center">Center</button>
  <span id="status">status: idle</span>
</div>

<div id="field">
  <div id="ball"></div>
</div>

<div id="log"></div>

<script>
(() => {
  const field = document.getElementById('field');
  const ball  = document.getElementById('ball');
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  const urlInput = document.getElementById('url');
  const pollInput = document.getElementById('poll');
  const connectBtn = document.getElementById('connect');
  const centerBtn = document.getElementById('center');

  // Terrain
  const W = () => field.clientWidth;
  const H = () => field.clientHeight;
  const R = 16; // rayon de la balle (32px / 2)

  // État
  let x = W()/2, y = H()/2;     // position en px
  let vx = 0, vy = 0;           // vitesse en px/frame
  let lastLabel = null;
  let lastTs = 0;
  let timer = null;
  let rafHandle = null;

  function setStatus(s){ statusEl.textContent = 'status: ' + s; }
  function log(s){ logEl.textContent = s + '\n' + logEl.textContent.split('\n').slice(0,50).join('\n'); }

  function applyLabel(label, confidence){
    const base = 4; // vitesse de base (px/frame)
    const speed = base * (Number(confidence) > 0 ? Number(confidence) : 1);
    let dx = 0, dy = 0;
    switch(String(label).toLowerCase()){
      case 'left':  dx = -speed; break;
      case 'right': dx = +speed; break;
      case 'up':    dy = -speed; break;
      case 'down':  dy = +speed; break;
      case 'stop':
      case 'neutral':
      case 'idle':
        dx = 0; dy = 0; break;
      default:
        // labels continus (ex: {"dx":0.3,"dy":-0.1}) dans payload ?
        // on tente de lire payload.dx/dy si dispo (voir fetchLast)
        break;
    }
    vx = dx; vy = dy;
  }

  function animate(){
    x += vx; y += vy;
    // collisions bords
    if (x < R) x = R;
    if (y < R) y = R;
    if (x > W()-R) x = W()-R;
    if (y > H()-R) y = H()-R;
    ball.style.left = x + 'px';
    ball.style.top  = y + 'px';
    rafHandle = requestAnimationFrame(animate);
  }

  async function fetchLast(){
    const base = urlInput.value.replace(/\/+$/,'');
    try{
      const r = await fetch(base + '/last', {cache:'no-store'});
      if(!r.ok){ setStatus('HTTP '+r.status); return; }
      const j = await r.json();
      if (!j || !j.label){ return; } // rien de nouveau
      // dédupli simple
      const ts = j.ts || 0;
      if (ts && ts === lastTs && j.label === lastLabel) return;
      lastLabel = j.label; lastTs = ts;

      // log & apply
      log(`[last] ${new Date().toLocaleTimeString()}  label=${j.label}  conf=${j.confidence ?? '-'}  payload=${JSON.stringify(j.payload ?? {})}`);
      setStatus('recv: ' + j.label);
      // si payload contient un dx/dy continu, on privilégie
      if (j.payload && typeof j.payload.dx === 'number' && typeof j.payload.dy === 'number'){
        const gain = (Number(j.confidence) > 0 ? Number(j.confidence) : 1);
        vx = j.payload.dx * 8 * gain;
        vy = j.payload.dy * 8 * gain;
      } else {
        applyLabel(j.label, j.confidence);
      }
    }catch(e){
      setStatus('error: ' + e.message);
    }
  }

  function start(){
    if (timer) clearInterval(timer);
    const period = Math.max(30, Number(pollInput.value)||100);
    timer = setInterval(fetchLast, period);
    if (!rafHandle) animate();
    setStatus('polling');
  }
  function stop(){
    if (timer){ clearInterval(timer); timer=null; }
    if (rafHandle){ cancelAnimationFrame(rafHandle); rafHandle=null; }
    setStatus('stopped');
  }

  connectBtn.onclick = () => {
    if (timer){ stop(); connectBtn.textContent='Start'; }
    else { start(); connectBtn.textContent='Stop'; }
  };
  centerBtn.onclick = () => { x = W()/2; y = H()/2; vx = vy = 0; };

  // start auto
  start();
})();
</script>
