  - Heavy rendering can reduce FPS—use decimation.
  inputs:
    segment: 2D float [ch x samples] or raw/derived
    sfreq: float (Hz, if segment)
  outputs: {}
  parameters:
  - default: '50.0'
    desc: Vertical scale
    name: scale_uv
    type: float
    unit: µV
  - default: '1.0'
    desc: Scroll speed
    name: speed
    type: float
  - default: 'False'
    desc: Fullscreen/Enlarge
    name: fullscreen
    type: bool
  summary: Visualize signals, features or predictions in real-time.
  usage: Connect upstream data; adjust scale and speed; optional fullscreen for demo.
bandpower_ext_plugin:
  gotchas:
  - Use Welch windows long enough for low f.
  - DC offsets can bias low-frequency power.
  inputs:
    segment: 2D float [ch x samples] or epochs
    sfreq: float (Hz)
  outputs:
    features: dict/array of band powers
    psd: array [ch x freq] (if PSD)
  parameters:
  - default: '1.0'
    desc: Lower frequency
    name: fmin
    type: float
    unit: Hz
  - default: '40.0'
    desc: Upper frequency
    name: fmax
    type: float
    unit: Hz
  - default: '[[''delta'',1,4],[''theta'',4,8],[''alpha'',8,13],[''beta'',13,30]]'
    desc: Named bands
    name: bands
    type: list
  summary: Compute spectral power (PSD, bandpower) from segments/epochs.
  usage: Connect an upstream source, set parameters if any, then route outputs to
    the next node.
