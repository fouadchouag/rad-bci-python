eeg_filter_plugin:
  gotchas:
  - Filter order must suit `sfreq` and transition width.
  - Beware of edge effects on short windows.
  inputs:
    raw: mne.Raw (optional)
    segment: 2D float [ch x samples] (optional)
    sfreq: float (Hz, if segment)
  outputs:
    raw: filtered mne.Raw (if raw input)
    segment: filtered array (if segment input)
  parameters:
  - default: '1.0'
    desc: High-pass cutoff
    name: hp
    type: float|None
    unit: Hz
  - default: '40.0'
    desc: Low-pass cutoff
    name: lp
    type: float|None
    unit: Hz
  - default: '50.0'
    desc: Notch (mains)
    name: notch
    type: float|None
    unit: Hz
  summary: Apply temporal filtering (HP/LP/BP/Notch) to Raw or segment data.
  usage: Connect an upstream source, set parameters if any, then route outputs to
    the next node.
