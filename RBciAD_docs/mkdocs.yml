site_name: RBciAD Docs
site_description: Reactive BCI Builder — User & Developer Documentation

theme:
  name: material
  features:
    - navigation.tabs
    - content.code.copy
    - search.suggest
    - search.highlight

use_directory_urls: false

plugins:
  - search

nav:
  - Home: index.md
  - User Guide:
      - Overview: user/index.md
      - Guide: user/guide.md
      - Nodes Catalog: user/nodes/index.md
      - All Nodes (quick link): user/nodes.md
  - Developer:
      - Overview: developer/index.md
      - Quickstart: developer/node-quickstart.md
      - I/O Types: developer/io-types.md
      - Plugin API: developer/plugin-api.md
      - Polyglot Nodes: developer/polyglot-nodes.md
      - Help System: developer/help-system.md
      - Testing & Debugging: developer/testing-and-debugging.md
      - Customize RBCIAD: developer/customize-rbciad.md
      - Release & Packaging: developer/release-packaging.md
      - Troubleshooting: developer/troubleshooting.md
  - Reference:
      - API: ref/api.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

extra:
  version: "1.9.0"