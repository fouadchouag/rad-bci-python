profiles:
  - id: W1-EDF
    source: EDF
    sr_hz: 200
    duration_s: 60
    edits:
      - {t: 5.0,  key: "win_s",   value: 9.0}
      - {t: 10.0, key: "win_s",   value: 8.0}
      - {t: 20.0, key: "gain",    value: 1.2}
      - {t: 30.0, key: "overlap", value: 0.45}
      - {t: 40.0, key: "overlap", value: 0.35}

  - id: W2-EDF
    source: EDF
    sr_hz: 200
    duration_s: 60
    edits:
      - {t: 5.0,  key: "band",    value: [8, 12]}
      - {t: 15.0, key: "band",    value: [12, 30]}
      - {t: 25.0, key: "overlap", value: 0.50}

  - id: W3-EDF
    source: EDF
    sr_hz: 200
    duration_s: 60
    edits:
      - {t: 2.0,  key: "win_s",   value: 1.0}
      - {t: 4.0,  key: "overlap", value: 0.80}
      - {t: 10.0, key: "gain",    value: 0.9}

  - id: W1-LSL
    source: LSL
    sr_hz: 200
    duration_s: 60
    edits:
      - {t: 5.0,  key: "win_s",   value: 9.0}
      - {t: 10.0, key: "win_s",   value: 8.0}
      - {t: 20.0, key: "gain",    value: 1.1}
      - {t: 30.0, key: "overlap", value: 0.45}
      - {t: 40.0, key: "overlap", value: 0.35}

bench:
  out_dir: logs
  hz_host_sampler: 5
